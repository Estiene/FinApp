name: FinApp tests

on:
  push:
    branches:
      - main
      - feature/stage-5c-5d-forecasting-dashboard
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: finapp_test
          POSTGRES_PASSWORD: finapp_test
          POSTGRES_DB: finapp_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finapp_test -d finapp_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and route tests
        run: python -m unittest discover -s tests -v
      - name: Verify migration upgrade and downgrade on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://finapp_test:finapp_test@localhost:5432/finapp_migration_test
          FINAPP_MIGRATION_TEST: '1'
        run: python -m unittest discover -s tests -p test_migration_upgrade.py -v
