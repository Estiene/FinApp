{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Edit Credit Card</h2>
  <p class="text-muted">Update details for {{ card.name }}.</p>

  <form method="POST" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Card Name</label>
      <input name="name" class="form-control"
             value="{{ card.name }}" maxlength="100" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Payment Account</label>
      <select name="payment_account_id" class="form-select" required>
        {% for account in accounts %}
        <option value="{{ account.id }}"
          {% if account.id == card.payment_account_id %}selected{% endif %}>
          {{ account.name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Current Balance ($)</label>
      <input type="number" name="balance" class="form-control"
             min="0" step="0.01" value="{{ card.balance }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Balance As Of</label>
      <input type="date" name="balance_as_of" class="form-control"
             value="{{ card.balance_as_of.isoformat() }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Minimum Payment ($)</label>
      <input type="number" name="minimum_payment" class="form-control"
             min="0" step="0.01" value="{{ card.minimum_payment }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Extra Payment ($)</label>
      <input type="number" name="extra_payment" class="form-control"
             min="0" step="0.01" value="{{ card.extra_payment }}">
    </div>

    <div class="col-md-4">
      <label class="form-label">Statement Closing Day</label>
      <input type="number" name="statement_close_day" class="form-control"
             min="1" max="31" value="{{ card.statement_close_day }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Payment Due Day</label>
      <input type="number" name="payment_due_day" class="form-control"
             min="1" max="31" value="{{ card.payment_due_day }}" required>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('main.credit_cards') }}"
         class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
