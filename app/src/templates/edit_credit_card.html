{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Edit Credit Card</h2>
  <p class="text-muted">Update details for {{ card.name }}.</p>

  <form method="POST" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Card Name</label>
      <input name="name" class="form-control"
             value="{{ card.name }}" maxlength="100" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Payment Account</label>
      <select name="payment_account_id" class="form-select" required>
        {% for account in accounts %}
        <option value="{{ account.id }}"
          {% if account.id == card.payment_account_id %}selected{% endif %}>
          {{ account.name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Current Balance ($)</label>
      <input type="number" name="balance" class="form-control"
             min="0" step="0.01" value="{{ card.balance }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Balance As Of</label>
      <input type="date" name="balance_as_of" class="form-control"
             value="{{ card.balance_as_of.isoformat() }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Minimum Payment ($)</label>
      <input type="number" name="minimum_payment" class="form-control"
             min="0" step="0.01" value="{{ card.minimum_payment }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Extra Payment ($)</label>
      <input type="number" name="extra_payment" class="form-control"
             min="0" step="0.01" value="{{ card.extra_payment }}">
    </div>

    <div class="col-md-4">
      <label class="form-label">Extra Payment Day (optional)</label>
      <input type="number" name="extra_payment_day" class="form-control"
             min="1" max="31" value="{{ card.extra_payment_day or '' }}"
             placeholder="Uses due date if blank">
      <div class="form-text">Calendar day for recurring extra payment; blank means due date.</div>
    </div>
    <div class="col-md-4">
      <label class="form-label">Bill-related Payment Timing</label>
      <select name="bill_payment_timing" class="form-select">
        <option value="due_date" {% if card.bill_payment_timing == 'due_date' %}selected{% endif %}>On payment due date</option>
        <option value="days_before_due" {% if card.bill_payment_timing == 'days_before_due' %}selected{% endif %}>Days before payment due date</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Days Before Due</label>
      <input type="number" name="bill_payment_days_before" class="form-control"
             min="0" max="31" value="{{ card.bill_payment_days_before or 0 }}">
      <div class="form-text">Only used when scheduling days before due.</div>
    </div>
    <div class="col-md-4">
      <label class="form-label">Statement Closing Day</label>
      <input type="number" name="statement_close_day" class="form-control"
             min="1" max="31" value="{{ card.statement_close_day }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Payment Due Day</label>
      <input type="number" name="payment_due_day" class="form-control"
             min="1" max="31" value="{{ card.payment_due_day }}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Standard APR (%) (optional)</label>
      <input type="number" name="annual_percentage_rate" class="form-control" min="0" max="100" step="0.01" value="{{ card.annual_percentage_rate if card.annual_percentage_rate is not none else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Credit Limit ($) (optional)</label>
      <input type="number" name="credit_limit" class="form-control" min="0.01" step="0.01" value="{{ card.credit_limit if card.credit_limit is not none else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Promotional APR (%) (optional)</label>
      <input type="number" name="promotional_apr" class="form-control" min="0" max="100" step="0.01" value="{{ card.promotional_apr if card.promotional_apr is not none else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Promotional APR Ends (optional)</label>
      <input type="date" name="promotional_apr_end_date" class="form-control" value="{{ card.promotional_apr_end_date.isoformat() if card.promotional_apr_end_date else '' }}">
      <div class="form-text">Enter both promotional APR and end date, or leave both blank.</div>
    </div>
    <div class="col-12">
      <button type="submit" name="save_action" value="stay" class="btn btn-primary">Save</button>
      <button type="submit" name="save_action" value="exit" class="btn btn-outline-primary">Save &amp; Exit</button>
      <a href="{{ url_for('main.credit_cards') }}"
         class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
