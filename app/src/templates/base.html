<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinApp</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('main.index') }}">FinApp</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'main.index' %} active{% endif %}"
               href="{{ url_for('main.index') }}">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'main.bills' %} active{% endif %}"
               href="{{ url_for('main.bills') }}">Bills</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'main.incomes' %} active{% endif %}"
               href="{{ url_for('main.incomes') }}">Income</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'main.report' %} active{% endif %}"
               href="{{ url_for('main.report') }}">Cash Flow</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint in ('main.accounts', 'main.update_account_balance') %} active{% endif %}"
               href="{{ url_for('main.accounts') }}">Accounts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'main.credit_cards' %} active{% endif %}"
               href="{{ url_for('main.credit_cards') }}">Credit Cards</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-xxl px-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
